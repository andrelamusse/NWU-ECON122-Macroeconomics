  <script>
    const EXAM_SCOPE = {"title": "ECON 122 2026 EXAM SCOPE", "disclaimer": "Disclaimer: This revision material is intended solely as a study aid to assist students in preparing for the examination. The inclusion of any topic or calculation in this material does not guarantee or imply that it will be assessed in the examination. Students are encouraged to use this material to guide their revision and to ensure that they prepare comprehensively for the examination in accordance with the prescribed module content.", "preparationLevels": [{"id": "not_yet", "label": "Not yet prepared", "description": "I do not understand the topic well enough to answer questions independently."}, {"id": "partial", "label": "Partially prepared", "description": "I understand some concepts/aspects but need more practice or revision."}, {"id": "well", "label": "Well prepared", "description": "I understand the topic and can perform the calculations or explain it confidently and independently."}], "sections": [{"id": "scope_calculations", "number": 1, "title": "1. EXAM PREPARATION CHECKLIST: CALCULATIONS", "subtitle": "25 Essential Quantitative & Formula Skills Across 7 Core Topics", "groups": [{"id": "calc_1", "number": "1", "title": "Gross Domestic Product (GDP)", "chapterId": "ch13", "chapterLabel": "Chapter 13", "solverId": "nat_accounts_solver", "extremePageId": "C1", "items": [{"id": "calc_1_1", "code": "1.1", "topic": "Calculating GDP at factor cost and market prices", "formula": "GDPmp = GDPfc + Taxes on production & imports − Subsidies  |  GDPfc = GDPmp − Taxes + Subsidies", "beginnerTip": "Market prices are what shoppers pay in stores (which includes price-raising indirect taxes like VAT, minus price-lowering government subsidies). Factor cost is what workers and business owners actually earn—so to go from Market Prices to Factor Cost, subtract indirect taxes and add back subsidies.", "knowledgePoints": ["Know the hierarchy of valuation: Factor Cost ↔ Basic Prices ↔ Market Prices.", "Market Prices include indirect taxes on products (like VAT, customs & excise duties) and deduct subsidies on products.", "To convert GDP at Factor Cost → GDP at Market Prices: ADD indirect taxes (or taxes on production & imports) and SUBTRACT subsidies.", "To convert GDP at Market Prices → GDP at Factor Cost: SUBTRACT indirect taxes and ADD subsidies."], "workedExample": "Given GDP at market prices = R1 530 580m, Taxes on production and imports = R205 562m, and Subsidies = R11 433m:\nGDP at factor cost = 1 530 580 − 205 562 + 11 433 = R1 336 451 million."}, {"id": "calc_1_2", "code": "1.2", "topic": "Calculating GDP using the income method", "formula": "GDP (Income) = Wages + Rent + Interest + Profit  (where Profit = Value Added − Wages − Rent − Interest)", "beginnerTip": "Every rand generated by production is paid out as income to the 4 factors of production: Labour earns Wages, Land earns Rent, Capital earns Interest, and Entrepreneurs keep Profit as the balancing item.", "knowledgePoints": ["The Income Method sums all factor rewards earned within domestic borders: Compensation of employees (Wages/Salaries) + Net Operating Surplus (Rent + Interest + Profit).", "At the firm level: Value Added = Wages + Rent + Interest + Profit.", "If Profit is unknown, rearrange: Profit = Value Added − (Wages + Rent + Interest).", "To go from Net Domestic Income at factor cost to Gross Domestic Product at factor cost, add Consumption of Fixed Capital (Depreciation)."], "workedExample": "A firm creates R50 000 in Value Added. It pays R22 000 in Wages, R8 000 in Rent, and R6 000 in Interest:\nProfit = 50 000 − (22 000 + 8 000 + 6 000) = R14 000.\nTotal Factor Income = 22 000 + 8 000 + 6 000 + 14 000 = R50 000."}, {"id": "calc_1_3", "code": "1.3", "topic": "Calculating GDP using the production (value-added) method", "formula": "Value Added = Value of Sales − Intermediate Purchases  |  GDP = Σ Value Added at each stage", "beginnerTip": "Never add up gross sales across a supply chain (farm → wholesaler → chef → event planner) because you would count the same ingredients multiple times! Only add the extra value each business creates (Sales minus what they bought from suppliers).", "knowledgePoints": ["Never sum gross sales across production stages—doing so causes double counting of intermediate inputs.", "At each stage of production: Value Added = Value of Output (Sales) − Cost of Intermediate Goods Purchased.", " The primary producer (first stage, e.g., farmer or miner with R0 intermediate inputs) adds value equal to 100% of their sales.", "Total GDP equals the sum of Value Added across all stages, which always equals the final retail sale price to the end consumer."], "workedExample": "Farmer sells wheat to Miller for R1 000 (VA = R1 000); Miller sells flour to Baker for R2 800 (VA = 2 800 − 1 000 = R1 800); Baker sells bread to households for R4 500 (VA = 4 500 − 2 800 = R1 700).\nTotal GDP = 1 000 + 1 800 + 1 700 = R4 500 (matches final bread value)."}, {"id": "calc_1_4", "code": "1.4", "topic": "Calculating GDP using the expenditure method", "formula": "GDP@MP = C + I + G + (X − Z)  |  GDE = C + I + G", "beginnerTip": "Add up all spending on final goods and services: Households (C) + Firms' capital investment (I) + Government (G) = Gross Domestic Expenditure (GDE). Then add Exports (X, produced here) and subtract Imports (Z, produced abroad) to get GDP.", "knowledgePoints": ["Gross Domestic Expenditure (GDE) is total spending INSIDE the country: GDE = C + I + G.", "Gross Domestic Product at Market Prices (GDP@MP) adds Exports (X) and subtracts Imports (Z): GDP@MP = C + I + G + (X − Z) = GDE + (X − Z).", "Remember: Investment (I) includes Gross Fixed Capital Formation PLUS Change in Inventories (if inventories fall, subtract that change).", "If given GDP@MP and asked for GDE, rearrange: GDE = GDP@MP − X + Z."], "workedExample": "Given C = R974 252m, I = R320 000m, G = R313 003m, Exports (X) = R492 646m, Imports (Z) = R569 321m:\nGDE = 974 252 + 320 000 + 313 003 = R1 607 255m.\nGDP@MP = 1 607 255 + (492 646 − 569 321) = R1 530 580m."}]}, {"id": "calc_2", "number": "2", "title": "Inflation", "chapterId": "ch20", "chapterLabel": "Chapter 20", "solverId": "deflator_solver", "extremePageId": "C4", "items": [{"id": "calc_2_1", "code": "2.1", "topic": "Calculating the month-on-month inflation rate", "formula": "Month-on-Month Inflation (%) = [(CPI this month − CPI previous month) ÷ CPI previous month] × 100", "beginnerTip": "Compares a month's CPI with the immediately preceding month (e.g., March 2026 vs February 2026). Always divide the change by the earlier (previous) month's CPI.", "knowledgePoints": ["Month-on-month inflation measures the percentage change in the Consumer Price Index (CPI) between two adjacent months (e.g., March vs February of the same year).", "Formula: [(CPI_current_month − CPI_previous_month) ÷ CPI_previous_month] × 100.", "Always divide by the PREVIOUS month's CPI (the earlier period is the base of comparison).", "Round your final percentage to two decimal places unless instructed otherwise."], "workedExample": "If CPI in February 2026 is 112.4 and CPI in March 2026 is 113.8:\nMonth-on-Month Inflation = [(113.8 − 112.4) ÷ 112.4] × 100 = (1.4 ÷ 112.4) × 100 = 1.25%."}, {"id": "calc_2_2", "code": "2.2", "topic": "Calculating the year-on-year inflation rate", "formula": "Year-on-Year Inflation (%) = [(CPI month this year − CPI same month last year) ÷ CPI same month last year] × 100", "beginnerTip": "Compares a month's CPI with the exact same month one year earlier (e.g., April 2026 vs April 2025). This removes seasonal spikes (like December holidays) and is the headline rate used for SARB's 3%–6% target.", "knowledgePoints": ["Year-on-year inflation compares a month's CPI with the EXACT SAME month in the previous year (e.g., May 2026 vs May 2025) to eliminate seasonal distortions.", "Formula: [(CPI_month_this_year − CPI_same_month_last_year) ÷ CPI_same_month_last_year] × 100.", "If using annual average CPI or the GDP Deflator (Nominal GDP ÷ Real GDP × 100), apply the same growth formula between Year t and Year t−1.", "Compare the result against SARB's inflation target range of 3% to 6%."], "workedExample": "If CPI in December 2024 was 110.2 and CPI in December 2025 was 116.5:\nYear-on-Year Inflation = [(116.5 − 110.2) ÷ 110.2] × 100 = (6.3 ÷ 110.2) × 100 = 5.72% (within the 3%–6% target band)."}]}, {"id": "calc_3", "number": "3", "title": "Unemployment and the Labour Market", "chapterId": "ch21", "chapterLabel": "Chapter 21", "solverId": "labour_solver", "extremePageId": "C5", "items": [{"id": "calc_3_1", "code": "3.1", "topic": "Calculating the narrow unemployment rate", "formula": "Narrow Unemployment Rate (%) = (Strictly Unemployed ÷ Strict Labour Force) × 100", "beginnerTip": "Only counts jobless people aged 15–64 who actively looked for work in the past 4 weeks, divided by the strict labour force (Employed + Strictly Unemployed).", "knowledgePoints": ["Under the strict (narrow/official) definition, a person is unemployed ONLY if they are aged 15–64, jobless, available to work, AND took active steps to find work in the past 4 weeks.", "Strict Labour Force = Employed + Strictly Unemployed.", "Narrow Unemployment Rate (%) = (Strictly Unemployed ÷ Strict Labour Force) × 100.", "Never include discouraged work-seekers or economically inactive people in the narrow rate."], "workedExample": "Given Employed = 16.5 million and Strictly Unemployed = 7.5 million:\nStrict Labour Force = 16.5m + 7.5m = 24.0 million.\nNarrow Unemployment Rate = (7.5 ÷ 24.0) × 100 = 31.25%."}, {"id": "calc_3_2", "code": "3.2", "topic": "Calculating the broad unemployment rate", "formula": "Broad UR (%) = [(Strictly Unemployed + Discouraged Work-Seekers) ÷ (Strict LF + Discouraged)] × 100", "beginnerTip": "Adds discouraged work-seekers (people who want a job but gave up searching) to BOTH the top (unemployed) and the bottom (broad labour force).", "knowledgePoints": ["The broad (expanded) definition drops the 'actively searched in the last 4 weeks' requirement and includes Discouraged Work-Seekers.", "Crucial Rule: Add Discouraged Work-Seekers to BOTH the numerator (Broad Unemployed) AND the denominator (Expanded Labour Force).", "Broad Unemployment Rate (%) = [(Strictly Unemployed + Discouraged) ÷ (Employed + Strictly Unemployed + Discouraged)] × 100.", "The broad unemployment rate is always higher than the narrow unemployment rate whenever discouraged work-seekers > 0."], "workedExample": "Continuing with Employed = 16.5m, Strictly Unemployed = 7.5m, and Discouraged Work-Seekers = 3.5m:\nBroad Unemployed = 7.5m + 3.5m = 11.0m; Broad Labour Force = 24.0m + 3.5m = 27.5m.\nBroad Unemployment Rate = (11.0 ÷ 27.5) × 100 = 40.00%."}, {"id": "calc_3_3", "code": "3.3", "topic": "Identifying and calculating the labour force", "formula": "Strict Labour Force = Employed + Strictly Unemployed  |  Broad LF = Strict LF + Discouraged", "beginnerTip": "Full-time students, homemakers, retirees, and ill/disabled persons are Not Economically Active—never include them in the labour force!", "knowledgePoints": ["First filter out non-working-age persons (children under 15 and elders over 64) to get the Working-Age Population (15–64 years).", "Next filter out the Not Economically Active (full-time students, homemakers/housewives, retirees, and medically unfit/disabled persons).", "Strict Labour Force (Economically Active Population) = Employed (formal + informal) + Strictly Unemployed.", "Broad (Expanded) Labour Force = Strict Labour Force + Discouraged Work-Seekers."], "workedExample": "Population = 60m; Children (<15) = 16m; Retirees/Students/Homemakers = 16.5m; Discouraged = 3.5m; Employed = 16.5m; Strictly Unemployed = 7.5m:\nWorking-Age Pop = 60m − 16m = 44m.\nStrict Labour Force = 16.5m + 7.5m = 24.0m (Broad LF = 24.0m + 3.5m = 27.5m)."}, {"id": "calc_3_4", "code": "3.4", "topic": "Calculating the labour force participation rate", "formula": "LFPR (%) = (Labour Force ÷ Working-Age Population aged 15–64) × 100", "beginnerTip": "Measures what percentage of the entire working-age population (15–64 years) is actively participating in the job market (either working or actively looking).", "knowledgePoints": ["The Labour Force Participation Rate (LFPR) measures the percentage of the working-age population (15–64) that is economically active.", "Formula: LFPR (%) = (Strict Labour Force ÷ Working-Age Population aged 15–64) × 100.", "Do NOT divide by the total population—always subtract children under 15 (and 65+ retirees if outside 15–64) from the denominator first.", "Understand the difference between LFPR (active share of working-age population) and Unemployment Rate (unemployed share of labour force)."], "workedExample": "With Strict Labour Force = 24.0 million and Working-Age Population (aged 15–64) = 44.0 million:\nLFPR = (24.0 ÷ 44.0) × 100 = 54.55%."}]}, {"id": "calc_4", "number": "4", "title": "Money Supply", "chapterId": "ch14", "chapterLabel": "Chapter 14", "solverId": "money_solver", "extremePageId": "C6", "items": [{"id": "calc_4_1", "code": "4.1", "topic": "Calculating M1", "formula": "M1 = Coins & banknotes in circulation outside banks (C) + Demand deposits of domestic private sector (D)", "beginnerTip": "M1 is the narrowest measure of money (immediate spending money). Never include cash sitting inside bank vaults or central government deposits!", "knowledgePoints": ["M1 is the narrowest monetary aggregate, reflecting money's function strictly as a Medium of Exchange.", "Formula: M1 = Coins and banknotes in circulation OUTSIDE the monetary sector (C) + Cheque and transmission (demand) deposits of the domestic private sector (D).", "Exam Trap 1: NEVER include cash held inside commercial bank vaults or ATMs (only notes/coins in the hands of the public).", "Exam Trap 2: NEVER include government deposits or foreign deposits—only domestic private sector demand deposits."], "workedExample": "Coins & notes with the public = R180bn; Cash in bank vaults = R45bn (ignore!); Private demand/cheque deposits = R920bn:\nM1 = 180 + 920 = R1 100 billion."}, {"id": "calc_4_2", "code": "4.2", "topic": "Calculating M2", "formula": "M2 = M1 + Short- and medium-term deposits of the domestic private sector", "beginnerTip": "Start with your M1 total and add short-term (under 30 days) and medium-term (under 6 months) private deposits (also called quasi-money).", "knowledgePoints": ["M2 equals M1 plus all other short-term (under 30 days) and medium-term (under 6 months) deposits of the domestic private sector.", "These short- and medium-term deposits are known as 'quasi-money' (near-money) because they can be converted into cash or demand deposits quickly without loss of value.", "Formula: M2 = M1 + Short-term private deposits + Medium-term private deposits.", "Always compute M1 accurately first because any error in M1 carries forward into M2."], "workedExample": "Given M1 = R1 100bn, Short-term deposits = R410bn, and Medium-term deposits = R340bn:\nM2 = 1 100 + 410 + 340 = R1 850 billion."}, {"id": "calc_4_3", "code": "4.3", "topic": "Calculating M3", "formula": "M3 = M2 + Long-term deposits (longer than 6 months) of the domestic private sector", "beginnerTip": "Start with M2 and add long-term deposits. M3 is the most comprehensive measure of money and best reflects money's store-of-value function.", "knowledgePoints": ["M3 is the broadest and most reliable monetary aggregate in South Africa, reflecting money's Store of Value function.", "Formula: M3 = M2 + Long-term deposits (maturity longer than 6 months) of the domestic private sector.", "Equivalently: M3 = Coins/notes outside banks + All demand, short-term, medium-term, and long-term domestic private deposits.", "Ignore distractors like Gold & Foreign Exchange Reserves, SARB overdrafts, or Treasury bills."], "workedExample": "Given M2 = R1 850bn and Long-term private sector deposits = R650bn:\nM3 = 1 850 + 650 = R2 500 billion."}]}, {"id": "calc_5", "number": "5", "title": "Taxation", "chapterId": "ch15", "chapterLabel": "Chapter 15", "solverId": "sars_tax_solver", "extremePageId": "C7", "items": [{"id": "calc_5_1", "code": "5.1", "topic": "Calculating the tax rate", "formula": "Tax Payable = Base Tax + [Marginal Rate × (Income − Bracket Threshold)] − Applicable Rebates", "beginnerTip": "If salary is given per month, multiply by 12 first! Find the matching annual income bracket, apply the percentage only to the income above that bracket's lower threshold, and subtract age-based rebates (Primary <65, plus Secondary 65+, plus Tertiary 75+).", "knowledgePoints": ["Step 1: If income is given per month, multiply by 12 to get Annual Taxable Income.", "Step 2: Locate the matching tax bracket in the SARS table. Gross Tax = Base Tax of that bracket + [Marginal Rate × (Taxable Income − Bracket Threshold)].", "Step 3: Subtract all age-qualifying rebates: Under 65 gets Primary rebate only; 65–74 gets Primary + Secondary; 75+ gets Primary + Secondary + Tertiary.", "Exam Trap: Never apply the bracket's marginal percentage to the entire income—apply it ONLY to the excess above the bracket's lower threshold."], "workedExample": "Taxpayer aged 37 earns R24 000/month → Annual income = R288 000. Bracket R237 101–R370 500: 'R42 678 + 26% of taxable income above R237 100'. Primary rebate = R13 500:\nGross Tax = 42 678 + 0.26 × (288 000 − 237 100) = 42 678 + 13 234 = R55 912.\nNet Tax Payable = 55 912 − 13 500 = R42 412."}, {"id": "calc_5_2", "code": "5.2", "topic": "Calculating the effective tax rate", "formula": "Effective (Average) Tax Rate (%) = (Net Tax Payable ÷ Total Taxable Income) × 100", "beginnerTip": "Shows the overall percentage of a person's total income that actually goes to SARS after rebates. If this percentage rises as income rises, the tax is progressive; if it falls as income rises (like VAT), it is regressive.", "knowledgePoints": ["The Effective (Average) Tax Rate is the percentage of total annual taxable income actually paid in tax.", "Formula: Effective Tax Rate (%) = (Net Tax Payable ÷ Annual Taxable Income) × 100 (or Gross Tax ÷ Income × 100 if before rebates).", "In a progressive tax system (like South Africa's personal income tax), the effective tax rate increases as taxable income increases.", "The effective (average) tax rate is always strictly lower than the marginal tax rate for taxpayers above the lowest bracket."], "workedExample": "With Net Tax Payable = R42 412 on Annual Taxable Income = R288 000:\nEffective Tax Rate = (42 412 ÷ 288 000) × 100 = 14.73%."}, {"id": "calc_5_3", "code": "5.3", "topic": "Calculating the marginal tax rate", "formula": "Marginal Tax Rate (%) = Statutory bracket percentage applied to each additional R1 of income", "beginnerTip": "You can read the marginal tax rate directly from the taxpayer's bracket in the SARS table (e.g., 39%). It tells you how many cents of tax are paid on the very next rand earned.", "knowledgePoints": ["The Marginal Tax Rate (MTR) is the statutory percentage taxed on each additional R1 of income earned within the taxpayer's bracket.", "Formula: MTR = (ΔTax ÷ ΔIncome) × 100 = Bracket percentage directly from the SARS tax table.", "No calculation is needed if you have the SARS table: simply locate the taxpayer's annual income row and read off the percentage rate for that bracket.", "Know how MTR compares to Average Tax Rate (ATR): when MTR > ATR, the tax schedule is progressive."], "workedExample": "For a taxpayer earning R288 000 per year (in the R237 101–R370 500 bracket with 'R42 678 + 26% above R237 100'):\nThe Marginal Tax Rate is 26%."}]}, {"id": "calc_6", "number": "6", "title": "International Trade", "chapterId": "ch16", "chapterLabel": "Chapter 16", "solverId": "nat_accounts_solver", "extremePageId": "C8", "items": [{"id": "calc_6_1", "code": "6.1", "topic": "Calculating absolute advantage", "formula": "Compare total physical output per worker/resource: Higher maximum output = Absolute Advantage", "beginnerTip": "Whoever can produce MORE of a good using the exact same time or resources has the absolute advantage in that good.", "knowledgePoints": ["Absolute Advantage compares physical productivity: which country can produce MORE units of a good using the exact same quantity of resources (or fewer resources per unit).", "Compare Country A vs Country B for Good X (higher output wins), then compare Country A vs Country B for Good Y (higher output wins).", "One country can have an absolute advantage in BOTH goods (or just one good).", "Absolute advantage does NOT determine specialization when one country is better at everything—comparative advantage does."], "workedExample": "With 1 worker-day, South Africa produces 40 tons of Maize or 20 tons of Coal; Botswana produces 10 tons of Maize or 15 tons of Coal:\nSA has an absolute advantage in BOTH Maize (40 > 10) and Coal (20 > 15)."}, {"id": "calc_6_2", "code": "6.2", "topic": "Calculating comparative advantage", "formula": "Opportunity Cost of 1 unit of Good A = (Output of Good B given up) ÷ (Output of Good A)", "beginnerTip": "Put what you WANT to find the cost of in the denominator: Cost of 1 X = Y ÷ X. The country with the LOWER opportunity cost has the comparative advantage and should specialise in and export that good.", "knowledgePoints": ["Comparative Advantage is based on Opportunity Cost: how many units of Good Y must be sacrificed to produce 1 unit of Good X.", "Golden Rule Formula: Opportunity Cost of 1 unit of X = (Maximum output of Y given up) ÷ (Maximum output of X). Put what you want 1 unit of in the denominator!", "The country with the LOWER opportunity cost for Good X has the comparative advantage in Good X and must specialise in and export Good X.", "It is mathematically impossible for one country to have a comparative advantage in both goods (unless opportunity cost ratios are identical)."], "workedExample": "SA (40 Maize or 20 Coal): Cost of 1 Maize = 20÷40 = 0.5 Coal; Cost of 1 Coal = 40÷20 = 2 Maize.\nBotswana (10 Maize or 15 Coal): Cost of 1 Maize = 15÷10 = 1.5 Coal; Cost of 1 Coal = 10÷15 = 0.67 Maize.\nSA has lower cost in Maize (0.5 < 1.5 → exports Maize); Botswana has lower cost in Coal (0.67 < 2 → exports Coal)."}, {"id": "calc_6_3", "code": "6.3", "topic": "Calculating the terms of trade", "formula": "Terms of Trade Index (TOT) = (Export Price Index ÷ Import Price Index) × 100", "beginnerTip": "For barter trade between two countries, mutually beneficial terms of trade for 1 unit must lie strictly between the two countries' domestic opportunity costs. For price indices, TOT < 100 is unfavourable (exports buy fewer imports).", "knowledgePoints": ["Index Formula: Terms of Trade (TOT) = (Export Price Index ÷ Import Price Index) × 100.", "If TOT rises above 100 (or increases over time), the terms of trade have improved: 1 unit of exports buys MORE imports. If TOT falls, terms of trade deteriorated.", "Barter Exchange Ratio Rule: For trade between two countries to benefit BOTH, the exchange price of 1 unit of X must lie strictly BETWEEN the two countries' domestic opportunity costs of X.", "Always check both meanings (Price Index TOT and mutually beneficial barter TOT range)."], "workedExample": "Index: Export Price Index = 126, Import Price Index = 112 → TOT = (126 ÷ 112) × 100 = 112.50 (improved).\nBarter range from 6.2: 1 Maize must trade for strictly between 0.5 Coal (SA's minimum) and 1.5 Coal (Botswana's maximum), e.g., 1 Maize = 1 Coal."}]}, {"id": "calc_7", "number": "7", "title": "The Keynesian Model", "chapterId": "ch17", "chapterLabel": "Chapters 17 & 18", "solverId": "keynesian_solver", "extremePageId": "C9", "items": [{"id": "calc_7_1", "code": "7.1", "topic": "Calculating the consumption function", "formula": "C = C̄ + cY  (or C = C̄ + c(1 − t)Y)  where  c = MPC = ΔC ÷ ΔY", "beginnerTip": "First find the slope c = (change in C) ÷ (change in Y). Then plug in any known (Y, C) pair to solve for autonomous consumption C̄ = C − cY.", "knowledgePoints": ["The Keynesian linear consumption function is C = C̄ + cY (closed economy without taxes) or C = C̄ + cYd = C̄ + c(1 − t)Y (with proportional tax rate t).", "C̄ is Autonomous Consumption (vertical intercept when Y = 0, funded by dissaving); c is the Marginal Propensity to Consume (MPC = ΔC ÷ ΔY, where 0 < c < 1).", "To find the equation from a table of (Y, C) values: first calculate c = (C₂ − C₁) ÷ (Y₂ − Y₁), then substitute one (Y, C) pair into C̄ = C − cY.", "With a proportional tax rate t, the effective slope with respect to total income Y becomes c(1 − t)."], "workedExample": "When Y = 0, C = 150; when Y = 500, C = 550:\nMPC (c) = (550 − 150) ÷ (500 − 0) = 400 ÷ 500 = 0.8.\nSince C̄ = 150 at Y = 0, the consumption function is C = 150 + 0.8Y."}, {"id": "calc_7_2", "code": "7.2", "topic": "Calculating equilibrium income using the multiplier approach", "formula": "Y* = α × Ā   where   Ā = C̄ + Ī + Ḡ + X̄ − Z̄", "beginnerTip": "Add up all autonomous spending (Ā, remember to subtract autonomous imports Z̄!) and multiply by the multiplier α.", "knowledgePoints": ["Equilibrium income via the multiplier is Y* = α × Ā.", "Step 1: Calculate total Autonomous Spending Ā = C̄ + Ī + Ḡ + X̄ − Z̄ (and subtract cT̄ if there is a lump-sum tax T̄).", "Exam Trap: Autonomous Imports (Z̄) are a leakage—always SUBTRACT Z̄ when summing Ā!", "Step 2: Calculate the appropriate multiplier α for the economy's sectors and multiply α × Ā."], "workedExample": "In a 2-sector economy with C = 150 + 0.8Y and I = 250:\nĀ = C̄ + Ī = 150 + 250 = 400.\nMultiplier α = 1 ÷ (1 − 0.8) = 1 ÷ 0.2 = 5.\nEquilibrium Income Y* = 5 × 400 = 2 000."}, {"id": "calc_7_3", "code": "7.3", "topic": "Calculating equilibrium income using the expenditure approach", "formula": "Set Y = C + I + G + X − Z, collect all Y terms on the left, and solve for Y", "beginnerTip": "Write out the full aggregate expenditure equation, substitute Yd = (1 − t)Y, subtract induced imports mY, move the Y terms to the left-hand side, and divide.", "knowledgePoints": ["At macroeconomic equilibrium, Aggregate Output/Income (Y) equals Aggregate Expenditure (A): Y = C + I + G + (X − Z).", "Write out the equation by substituting each component: Y = [C̄ + c(1 − t)Y] + Ī + Ḡ + X̄ − (Z̄ + mY).", "Group all terms containing Y on the left-hand side: Y − c(1 − t)Y + mY = C̄ + Ī + Ḡ + X̄ − Z̄.", "Factor out Y: Y[1 − c(1 − t) + m] = Ā, then divide Ā by [1 − c(1 − t) + m] to solve for Y*."], "workedExample": "Given C = 100 + 0.8Yd, t = 0.25, I = 140, G = 160 (closed economy):\nY = 100 + 0.8(1 − 0.25)Y + 140 + 160\nY = 400 + 0.6Y  →  Y − 0.6Y = 400  →  0.4Y = 400  →  Y* = 1 000."}, {"id": "calc_7_4", "code": "7.4", "topic": "Calculating the multiplier", "formula": "Closed economy: α = 1 ÷ (1 − c)  |  Open economy with tax: α = 1 ÷ [1 − c(1 − t) + m]", "beginnerTip": "Every rand spent circulates multiple times. Taxes (t) and imports (m) are leakages out of the circular flow, so they make the denominator bigger and the multiplier smaller.", "knowledgePoints": ["Know all 3 multiplier formulas depending on which sectors are present:", "1. Simple 2-sector (Households + Firms, or G with no tax): α = 1 ÷ (1 − c) = 1 ÷ s.", "2. 3-sector with proportional income tax rate t: α = 1 ÷ [1 − c(1 − t)]. (Order of operations: multiply c × (1 − t) FIRST, then subtract from 1!)", "3. 4-sector Open Economy with tax rate t and marginal propensity to import m: α = 1 ÷ [1 − c(1 − t) + m]."], "workedExample": "Given MPC (c) = 0.8, tax rate (t) = 0.20, and MPM (m) = 0.14:\nc(1 − t) = 0.8 × (1 − 0.20) = 0.8 × 0.80 = 0.64.\nDenominator = 1 − 0.64 + 0.14 = 0.50.\nOpen-Economy Multiplier α = 1 ÷ 0.50 = 2.00."}, {"id": "calc_7_5", "code": "7.5", "topic": "Calculating savings", "formula": "S = Y − C = −C̄ + sY   where   s = MPS = 1 − c", "beginnerTip": "When income is zero, households still spend C̄ by drawing down savings, so autonomous saving is negative (−C̄). From each extra rand of income, households save s = 1 − c.", "knowledgePoints": ["In a 2-sector economy, disposable income is either consumed or saved: Y = C + S, so S = Y − C.", "Substitute C = C̄ + cY into S = Y − C to get the Saving Function: S = −C̄ + (1 − c)Y = −C̄ + sY.", "The vertical intercept is −C̄ (dissaving when Y = 0), and the slope is the Marginal Propensity to Save: s = MPS = 1 − c (since MPC + MPS = 1).", "In a 2-sector equilibrium, Planned Saving must equal Planned Investment (S = I)."], "workedExample": "Given C = 150 + 0.8Y and Equilibrium Income Y* = 2 000:\nMPS (s) = 1 − 0.8 = 0.2, so the saving function is S = −150 + 0.2Y.\nAt Y* = 2 000: S = −150 + 0.2(2 000) = −150 + 400 = 250 (which equals I = 250)."}, {"id": "calc_7_6", "code": "7.6", "topic": "Calculating changes in equilibrium income", "formula": "ΔY = α × ΔI  (or α × ΔG)  |  New Equilibrium Y₁ = Y₀ + ΔY", "beginnerTip": "If autonomous investment or government spending changes without changing c, t, or m, simply multiply the spending injection by the multiplier α. If the tax rate t also changes, recalculate the new multiplier first!", "knowledgePoints": ["When any autonomous expenditure component changes (ΔI, ΔG, ΔX), equilibrium income changes by a multiplied amount: ΔY = α × ΔĀ.", "New Equilibrium Income is Y_new = Y_old + ΔY.", "To close a recessionary output gap (Y_full_employment − Y_current), the required fiscal injection is ΔG = ΔY_gap ÷ α.", "Exam Trap: If a question changes the tax rate t or MPC c, you cannot use the old α—you must calculate the new multiplier α_new and compute Y_new = α_new × Ā!"], "workedExample": "Initial Y₀ = 2 000 with multiplier α = 2.5. Government increases spending by ΔG = +120:\nΔY = 2.5 × 120 = +300.\nNew Equilibrium Income Y₁ = 2 000 + 300 = 2 300."}]}], "instructions": "Instructions: Go through each topic and indicate your current level of preparation by ticking the appropriate box. Be honest with yourself so that you can identify the areas that require more attention before the examination.", "preparationKey": [{"id": "not_yet", "label": "Not yet prepared", "desc": "I do not understand the topic well enough to answer questions independently."}, {"id": "partial", "label": "Partially prepared", "desc": "I understand some concepts but need more practice with calculations."}, {"id": "well", "label": "Well prepared", "desc": "I understand the topic and can perform the calculations independently."}]}, {"id": "scope_theory", "number": 2, "title": "2. EXAM PREPARATION CHECKLIST: THEORY", "subtitle": "21 Essential Theoretical, Graphical & Policy Topics Across 8 Core Areas", "groups": [{"id": "theo_1", "number": "1", "title": "Macroeconomic Objectives", "chapterId": "ch13", "chapterLabel": "Chapter 13", "extremePageId": "B2", "items": [{"id": "theo_1_1", "code": "1.1", "topic": "Defining and discussing macroeconomic objectives", "formula": "5 Objectives: Economic Growth, Full Employment, Price Stability, BoP/External Stability, Equitable Distribution of Income", "beginnerTip": "Be ready to name and explain all 5 objectives, and use the Phillips curve (inverse trade-off between inflation and unemployment) to explain why full employment and price stability often conflict.", "knowledgePoints": ["Memorise and define all 5 Macroeconomic Objectives: (1) Economic Growth (rising real GDP), (2) Full Employment (low unemployment), (3) Price Stability (low inflation within SARB's 3%–6% target), (4) Balance of Payments / External Stability (sustainable current account & stable exchange rate), and (5) Equitable Distribution of Income (measured by Lorenz curve & Gini coefficient).", "Understand how each objective is measured (Real GDP growth rate, Unemployment rate, CPI inflation, BoP accounts, Gini coefficient).", "Explain policy trade-offs using the Phillips Curve: expansionary policy to boost growth and reduce unemployment raises aggregate demand, which can push up inflation (conflict between Full Employment and Price Stability).", "Also note the trade-off between rapid economic growth and Balance of Payments stability (higher domestic incomeY induces higher imports Z, worsening the trade balance)."], "workedExample": "Model Exam Answer: 'The five macroeconomic objectives are economic growth, full employment, price stability, external (balance of payments) stability, and an equitable distribution of income. A classic conflict exists between full employment and price stability (illustrated by the downward-sloping short-run Phillips curve): stimulating aggregate demand to create jobs often triggers demand-pull inflation.'"}]}, {"id": "theo_2", "number": "2", "title": "National Income Accounting", "chapterId": "ch13", "chapterLabel": "Chapter 13", "extremePageId": "B3", "items": [{"id": "theo_2_1", "code": "2.1", "topic": "Gross Domestic Product (GDP) vs Gross Domestic Expenditure (GDE) vs Gross National Income (GNI)", "formula": "GDP = C + I + G + (X − Z) [Location]  |  GDE = C + I + G [Domestic Spending]  |  GNI = GDP + Net Primary Income [Residency]", "beginnerTip": "GDP is about WHERE goods are produced (inside SA borders). GDE is total spending inside SA borders (includes imports Z, excludes exports X). GNI is about WHO earns the income (SA permanent residents, wherever they are).", "knowledgePoints": ["GDP (Gross Domestic Product) is the total value of all FINAL goods and services produced WITHIN the geographic borders of a country in a given period: GDP = C + I + G + (X − Z).", "GDE (Gross Domestic Expenditure) is total final spending BY residents inside the country's borders: GDE = C + I + G. It includes imports (Z) because households/firms buy them domestically, and excludes exports (X) because foreigners buy them.", "Relationship between GDP and GDE: GDP = GDE + (X − Z). If X > Z (trade surplus), GDP > GDE; if Z > X (trade deficit), GDE > GDP.", "GNI (Gross National Income / GNP) is total income earned by PERMANENT RESIDENTS (citizens) regardless of location: GNI = GDP + Factor income earned abroad by SA residents − Factor income paid to foreign residents working in SA."], "workedExample": "Model Exam Answer: 'GDP is a geographic (location) concept measuring final output inside SA borders. GDE measures total domestic spending (C + I + G), differing from GDP by net exports (X − Z). GNI is a residency concept measuring income of SA permanent residents: because foreign firms/workers earn more inside SA than SA residents earn abroad, South Africa's GNI is typically smaller than its GDP.'"}]}, {"id": "theo_3", "number": "3", "title": "Money and Banking", "chapterId": "ch14", "chapterLabel": "Chapter 14", "extremePageId": "B4", "items": [{"id": "theo_3_1", "code": "3.1", "topic": "The three functions of money", "formula": "1. Medium of Exchange (payment)  |  2. Unit of Account (measuring prices)  |  3. Store of Value (holding wealth over time)", "beginnerTip": "Also remember why money is not income (income is a flow earned over time) or wealth (wealth is total accumulated assets like property and shares).", "knowledgePoints": ["1. Medium of Exchange: Money is generally accepted in payment for goods and services, overcoming the 'double coincidence of wants' required in a barter economy.", "2. Unit of Account: Money serves as a common standard/yardstick for stating and comparing market prices and recording debts.", "3. Store of Value: Money holds purchasing power over time from the day income is received until it is spent (though high inflation erodes its real value, making M3 include interest-bearing deposits).", "Distinguish Money from Income (a flow earned per month/year) and Wealth (total stock of physical and financial assets)."], "workedExample": "Model Exam Answer: 'When you check a R25 price tag on coffee, money acts as a unit of account; when you tap your debit card to pay R25, it acts as a medium of exchange; and when you keep R5 000 in a savings account for next semester, it acts as a store of value.'"}, {"id": "theo_3_2", "code": "3.2", "topic": "Types of demand for money and factors influencing the demand for money", "formula": "Active balances L₁(Y) = Transactions + Precautionary (driven by Income Y)  |  Passive balances L₂(i) = Speculative (inverse to Interest Rate i)", "beginnerTip": "A rise in the interest rate i causes an upward movement ALONG the LL curve (smaller quantity of money demanded). A rise in national income Y shifts the entire LL curve to the RIGHT.", "knowledgePoints": ["Keynes's three motives for holding money are grouped into Active Balances (L₁) and Passive Balances (L₂): Total Money Demand L = L₁(Y) + L₂(i).", "Active Balances (L₁): (1) Transactions motive (day-to-day purchases) and (2) Precautionary motive (unforeseen emergencies). L₁ depends POSITIVELY on National Income (Y)—a rise in Y shifts the L curve to the RIGHT.", "Passive Balances (L₂): (3) Speculative motive (holding cash vs interest-bearing bonds). L₂ depends INVERSELY on the Interest Rate (i)—when i is high, the opportunity cost of holding money is high (and bond prices are low, promising capital gains), so people hold less money.", "Graph Distinction: A change in the interest rate (i) causes a MOVEMENT ALONG the downward-sloping L curve; a change in real income (Y) SHIFTS the entire L curve."], "workedExample": "Model Exam Answer: 'Total money demand is L = L₁(Y) + L₂(i). Transactions and precautionary demand form active balances L₁, which increase when national income Y rises (shifting the LL curve rightward). Speculative demand forms passive balances L₂, which vary inversely with the interest rate i (moving upward along the LL curve when i rises).'"}, {"id": "theo_3_3", "code": "3.3", "topic": "The money creation process", "formula": "Passive creation (cash deposit → composition changes, M unchanged) vs Active creation (bank grants loan → new deposit, M increases)", "beginnerTip": "In South Africa there is NO independent vertical money supply curve because money is demand-determined (endogenous): banks create deposits in response to loan demand at the interest rate influenced by SARB's repo rate.", "knowledgePoints": ["Commercial banks create money primarily by granting credit (loans) to creditworthy borrowers, creating new demand deposits (D) in the process.", "Passive deposit creation: When a member of the public deposits physical cash into a bank, cash in circulation (C) falls and demand deposits (D) rise by the exact same amount—the composition of M1 changes, but total money supply M is UNCHANGED.", "Active deposit creation: When a bank grants a new loan/overdraft and credits the borrower's cheque account, new demand deposits (D) are created without reducing cash—total money supply M INCREASES.", "Endogenous Money Supply: There is NO independent vertical money supply curve in South Africa. Money supply is demand-determined at the intersection of the downward-sloping money demand curve (L) and the horizontal interest rate line anchored by SARB's repo rate."], "workedExample": "Model Exam Answer: 'Money is created endogenously when commercial banks grant loans and credit borrowers' demand deposit accounts. Because banks accommodate credit demand at the prevailing interest rate (linked to the SARB repo rate) and borrow any required cash reserves from the SARB under the accommodation policy, the quantity of money M is determined by the demand for money.'"}, {"id": "theo_3_4", "code": "3.4", "topic": "The role and functions of the South African Reserve Bank", "formula": "1. Monetary policy (repo rate)  |  2. Service to government  |  3. Economic/statistical services  |  4. Financial stability / Banker's bank & note issue", "beginnerTip": "SARB formulates monetary policy, acts as banker to government and other banks (lender of last resort), issues coins/notes, and publishes statistics—it does NOT collect taxes (that is SARS).", "knowledgePoints": ["The South African Reserve Bank (SARB) is the constitutionally independent central bank whose primary mandate is to protect the value of the currency (price stability: 3%–6% CPI target) in the interest of balanced and sustainable growth.", "Four Major Functions of the SARB:", "1. Formulation and implementation of monetary policy (via the Repo Rate accommodation system, open-market operations, and cash reserve requirements).", "2. Service to the Government (banker and advisor to government, custodian of gold and foreign exchange reserves).", "3. Provision of economic and statistical services (Quarterly Bulletin, national accounts and balance of payments data).", "4. Maintaining financial stability (bank supervision/prudential authority, sole issuer of banknotes and coins, banker's bank providing clearing/settlement and acting as lender of last resort)."], "workedExample": "Model Exam Answer: 'The SARB formulates monetary policy using the repo rate to maintain inflation within 3%–6%, acts as banker to the government and commercial banks (lender of last resort and national payment clearinghouse), holds gold and foreign exchange reserves, issues banknotes and coins, and publishes official economic statistics.'"}]}, {"id": "theo_4", "number": "4", "title": "Market Failure and Government Intervention", "chapterId": "ch15", "chapterLabel": "Chapter 15", "extremePageId": "B5", "items": [{"id": "theo_4_1", "code": "4.1", "topic": "Market failure and its causes", "formula": "Causes: 1. Monopoly/imperfect competition  |  2. Public goods (non-rival, non-excludable)  |  3. Externalities  |  4. Common property resources", "beginnerTip": "Know how to classify goods by Rivalry and Excludability: Private (Yes/Yes), Pure Public (No/No, free-rider problem), Common Property (Yes/No, tragedy of the commons), Club/Toll (No/Yes).", "knowledgePoints": ["Market failure occurs when the price mechanism (unregulated market forces) fails to allocate resources efficiently (failing to achieve allocative or Pareto efficiency).", "Major Causes of Market Failure: (1) Monopoly and imperfect competition, (2) Public goods, (3) Externalities (spillover costs/benefits), (4) Asymmetric information, (5) Common property resources, and (6) Imperfect factor mobility / unequal income distribution.", "Classify goods using Rivalry in consumption and Excludability:", "• Private goods: Rival & Excludable (e.g., food, clothing).\n• Pure Public goods: Non-rival & Non-excludable (e.g., street lighting, national defence) → suffer from the Free-Rider Problem, so private markets under-provide or fail to provide them.\n• Common Property resources: Rival & Non-excludable (e.g., ocean fish) → suffer from overuse ('Tragedy of the Commons').\n• Mixed/Club goods: Non-rival & Excludable (e.g., uncongested toll road)."], "workedExample": "Model Exam Answer: 'Pure public goods like national defence and street lighting are non-rival (one person's use does not reduce availability to others) and non-excludable (non-payers cannot be prevented from benefiting). This creates the free-rider problem: private firms cannot charge a price per user, so the free market fails to supply them and government must provide them funded via taxation.'"}, {"id": "theo_4_2", "code": "4.2", "topic": "Externalities", "formula": "Negative externality (pollution): MSC = MPC + External Cost > MPC → Market overproduces (Q₁ > Q₂) & underprices (P₁ < P₂)", "beginnerTip": "On the graph, MSC lies above S = MPC. The market stops where D = MPC (Q₁), whereas society wants D = MSC (Q₂). The triangle between MSC, D, and Q₁ is the deadweight welfare loss.", "knowledgePoints": ["Externalities are costs or benefits of a transaction that spill over onto third parties not directly involved in the activity and are not reflected in the market price.", "Negative Externality in production (e.g., factory pollution): Marginal Social Cost (MSC) = Marginal Private Cost (MPC) + Marginal External Cost. Therefore, the MSC curve lies ABOVE (to the left of) the firm's supply curve S = MPC.", "Market Failure Outcome for Negative Externality: Unregulated market equilibrium occurs where Demand (MPB = MSB) intersects MPC at output Q₁ and price P₁. The socially efficient equilibrium is where MSB intersects MSC at lower output Q₂ (Q₂ < Q₁) and higher price P₂ (P₂ > P₁).", "Conclusion: Goods generating negative externalities are OVERPRODUCED (Q₁ > Q₂) and UNDERPRICED (P₁ < P₂) by the unregulated market, creating a triangular deadweight welfare loss."], "workedExample": "Model Exam Answer: 'On a negative externality diagram, the market supply curve reflects only Marginal Private Cost (MPC), while Marginal Social Cost (MSC) lies higher by the vertical distance of external pollution damage. Left to itself, the market equates Demand with MPC at (P₁, Q₁), overproducing relative to the socially optimal intersection of Demand with MSC at (P₂, Q₂), where P₂ > P₁ and Q₂ < Q₁.'"}, {"id": "theo_4_3", "code": "4.3", "topic": "The need for government intervention", "formula": "Correcting externalities via Pigouvian tax (equal to MSC − MPC) or direct regulation/pollution permits", "beginnerTip": "Taxing the polluter by the exact external cost per unit forces the firm to internalise the cost, shifting its supply curve up to MSC and restoring socially efficient output Q₂.", "knowledgePoints": ["When negative externalities cause market failure, government intervenes to force polluters to 'internalise the externality'.", "Main Policy Instrument: Impose a Pigouvian Tax per unit of output equal to the Marginal External Cost (vertical gap MSC − MPC at the socially optimal quantity Q₂).", "Graphical Effect: The Pigouvian tax shifts the firm's private supply curve upward from MPC to MSC = MPC + Tax, moving market equilibrium from (P₁, Q₁) to the socially efficient point (P₂, Q₂)—reducing pollution and eliminating the deadweight welfare loss.", "For Positive Externalities (e.g., vaccinations, education where MSB > MPB): the market underproduces, so government intervenes via subsidies, vouchers, or direct public provision."], "workedExample": "Model Exam Answer: 'To correct a negative production externality, the government levies a Pigouvian excise tax per unit equal to the marginal external cost (MSC − MPC). This raises the producer's private marginal cost until it coincides with MSC, shifting the supply curve leftward so output contracts from Q₁ to socially optimal Q₂ and price rises from P₁ to P₂.'"}, {"id": "theo_4_4", "code": "4.4", "topic": "Government failure", "formula": "Sources: Politicians (vote-maximising, short-term myopia), Bureaucrats (budget/empire-maximising, no competition), Rent seeking (lobbying for special favours)", "beginnerTip": "Just because markets fail does not guarantee government intervention succeeds—politicians, bureaucrats, and special-interest lobby groups have self-serving incentives.", "knowledgePoints": ["Government failure occurs when state intervention in the economy leads to an even more inefficient allocation of resources than would have occurred without intervention.", "Three Primary Sources of Government Failure:", "1. Behaviour of Politicians (Vote-maximising): Politicians pursue short-term vote-winning policies before elections rather than long-run economic efficiency, resulting in political business cycles and short-sighted spending.", "2. Behaviour of Bureaucrats (Civil servants): Government departments face no market competition or profit test; bureaucrats often maximise their own agency budgets, staff size, and salaries, leading to administrative inefficiency and red tape.", "3. Rent-Seeking (Special-interest groups): Powerful businesses, unions, or lobby groups spend resources lobbying government for tariffs, subsidies, or lucrative tenders/licences that benefit a narrow group at the expense of the general public."], "workedExample": "Model Exam Answer: 'Government failure arises from (1) vote-maximising politicians who favour short-term popular spending over long-term efficiency, (2) budget-maximising bureaucrats who operate without competitive market discipline, and (3) rent-seeking interest groups that lobby for privileged regulations, subsidies, or tariff protection at the public's expense.'"}, {"id": "theo_4_5", "code": "4.5", "topic": "Government spending and taxation", "formula": "3 Fiscal Functions: Allocation, Distribution, Stabilisation  |  3 Good Tax Criteria: Neutrality, Equity (horizontal & vertical), Administrative Simplicity", "beginnerTip": "Allocation fixes market under-supply (roads/schools); Distribution reduces inequality (progressive tax + grants); Stabilisation smooths business cycles using the budget.", "knowledgePoints": ["Three Economic Functions of Government (Musgrave's classification): (1) Allocative function (correcting market failure & providing public/merit goods), (2) Distributive function (reducing income inequality via progressive taxes, social grants, and free basic services), and (3) Stabilisation function (using fiscal & monetary policy to promote growth, employment, and price stability).", "How Government Spending is Financed: (1) Income from public property/state enterprises, (2) Taxation (main source), and (3) Government borrowing in domestic/foreign capital markets (when G > T, funding the budget deficit and increasing public debt).", "Three Criteria for a Good Tax: (1) Neutrality (minimise distortion of relative prices and incentives to work/invest), (2) Equity — both Horizontal Equity (equals taxed equally) and Vertical Equity (higher earners taxed more via ability-to-pay), and (3) Administrative Simplicity (low compliance and collection costs, closing tax avoidance/evasion loopholes).", "Tax Incidence Classification: Progressive (ATR rises as income rises, e.g., PAYE personal income tax), Proportional (ATR stays constant, e.g., flat corporate tax rate), Regressive (ATR falls as income rises, taking a larger % of poor households' income, e.g., VAT)."], "workedExample": "Model Exam Answer: 'Government performs allocative, distributive, and stabilisation functions, financed via taxation, borrowing, and state property income. A good tax satisfies neutrality, horizontal/vertical equity, and administrative simplicity. Personal income tax is direct and progressive, whereas VAT is indirect and regressive.'"}]}, {"id": "theo_5", "number": "5", "title": "Business Cycles and Inflation", "chapterId": "ch20", "chapterLabel": "Chapters 20 & 22", "extremePageId": "B6", "items": [{"id": "theo_5_1", "code": "5.1", "topic": "Theories of business cycles", "formula": "Turning points: Peak & Trough  |  Phases: Upswing (expansion) & Downswing (contraction)  |  Theories: Classical (exogenous), Keynesian (endogenous), Structuralist", "beginnerTip": "Also know Leading indicators (predict turns: exchange rate, oil price), Coincident indicators (move with economy: industrial production), and Lagging indicators (confirm later: duration of unemployment).", "knowledgePoints": ["A Business Cycle is the pattern of recurrent (but non-periodic) upswings and downswings in aggregate economic activity over time.", "Four Elements of a Complete Cycle: Trough (lower turning point) → Upswing / Expansion (real GDP and employment rise) → Peak (upper turning point) → Downswing / Contraction / Recession (real GDP falls, unemployment rises).", "Three Theories of Business Cycles: (1) Classical view: Market economy is inherently stable; cycles are caused by EXOGENOUS (outside) shocks like weather or policy mistakes—government should laissez-faire. (2) Keynesian view: Economy is inherently unstable; cycles are ENDOGENOUS (internal, driven by volatile investment/animal spirits)—government must use counter-cyclical fiscal/monetary policy (stimulate in downswing, cool in upswing). (3) Structuralist view: Cycles arise from institutional/structural shifts and random factors.", "Business Cycle Indicators: Leading indicators (peak/trough BEFORE the economy, e.g., new car sales, building plans passed, share prices), Coincident indicators (move AT THE SAME TIME, e.g., real GDP, industrial production), and Lagging indicators (change AFTER the turn, e.g., hours worked in construction, duration of unemployment)."], "workedExample": "Model Exam Answer: 'A business cycle moves from a Trough through an Upswing to a Peak and then a Downswing. Classical economists view cycles as exogenous shocks to a self-correcting economy, whereas Keynesians view cycles as endogenous instability requiring counter-cyclical policy. Leading indicators predict turning points in advance, coincident indicators track current activity, and lagging indicators confirm turning points afterwards.'"}, {"id": "theo_5_2", "code": "5.2", "topic": "Theories explaining the causes of inflation", "formula": "1. Demand-pull (AD shifts right)  |  2. Cost-push (AS shifts left → stagflation, use incomes policy)  |  3. Structuralist (underlying, initiating, propagating)  |  4. Conflict approach", "beginnerTip": "Never use restrictive monetary/fiscal policy to fight cost-push inflation, because reducing AD shrinks output and worsens unemployment even further! Use an incomes policy instead.", "knowledgePoints": ["Inflation is a continuous and considerable rise in the general price level (not a one-off price jump).", "1. Demand-Pull Inflation: 'Too much money chasing too few goods'—caused by increases in C, I, G, or X that shift Aggregate Demand (AD) RIGHTWARD. Price level (P) rises, while real output (Y) and employment INCREASE (until full employment Yf is reached). Policy cure: Restrictive monetary/fiscal policy (raise repo rate, cut G, raise T) to shift AD back left.", "2. Cost-Push Inflation: Triggered by rising production costs (wages rising faster than productivity, higher imported oil/intermediate prices, higher profit margins, falling productivity, or supply shocks) that shift Aggregate Supply (AS) UPWARD/LEFTWARD. Price level (P) rises AND real output (Y) FALLS (Stagflation!). Policy trap: Do NOT use restrictive AD policy (it worsens recession/unemployment); use supply-side measures and an Incomes Policy instead.", "3. Structuralist Approach: Distinguishes Underlying factors (structural rigidities), Initiating factors (one-off shocks like oil spikes or rand depreciation), and Propagating factors (the wage-price spiral that sustains inflation). 4. Conflict Approach: Inflation results from competing claims on national income (trade unions demanding higher wages + firms demanding higher profit margins) that exceed available real output."], "workedExample": "Model Exam Answer: 'Demand-pull inflation shifts AD rightward, raising both the price level P and real output Y; it is combated with restrictive fiscal/monetary policy. Cost-push inflation shifts AS upward/leftward, raising P while shrinking real output Y (stagflation); using restrictive policy here deepens unemployment, so policymakers must use supply-side reforms and an incomes policy. The structuralist model separates underlying, initiating, and propagating factors.'"}]}, {"id": "theo_6", "number": "6", "title": "International Trade and Globalisation", "chapterId": "ch16", "chapterLabel": "Chapter 16", "extremePageId": "B8", "items": [{"id": "theo_6_1", "code": "6.1", "topic": "Globalisation", "formula": "Deeper economic integration between countries (evidence: expanded trade, integrated capital markets, technology, mobile factors, rapid shock contagion)", "beginnerTip": "Globalisation links national economies together so goods, capital, tourists, and information cross borders faster—though financial crises also spread faster.", "knowledgePoints": ["Globalisation refers to the process of deeper economic integration and interdependence among countries worldwide into a single global market.", "Key Drivers & Evidence of Globalisation: (1) Rapid expansion of international trade in goods and services, (2) High cross-border mobility of financial capital and Foreign Direct Investment (FDI), (3) Advances in ICT, internet, and transport technology lowering transaction costs, and (4) Growth of multinational corporations and global supply chains.", "Advantages: Greater consumer choice, lower prices via comparative advantage, access to global capital and technology transfer.", "Risks/Disadvantages: Rapid contagion of international financial crises, vulnerability of developing countries to volatile capital outflows, and structural job losses in uncompetitive domestic industries."], "workedExample": "Model Exam Answer: 'Globalisation is the increasing integration of national economies through cross-border trade, capital flows, technology transfer, and multinational production chains. While it boosts efficiency and consumer choice through comparative advantage, it also exposes open economies like South Africa to global financial contagion and volatile exchange rate swings.'"}, {"id": "theo_6_2", "code": "6.2", "topic": "Theories of international trade", "formula": "Absolute advantage (more output from same resources) vs Comparative advantage (lower opportunity cost)", "beginnerTip": "Even if one country is better at producing everything (absolute advantage in both goods), both countries still gain from trade by specialising where their opportunity cost is lowest.", "knowledgePoints": ["Why countries trade: Uneven distribution of natural resources, technology, and human/physical capital across nations.", "Adam Smith's Theory of Absolute Advantage: A country should specialise in and export the good it can produce with greater absolute output per unit of input than its trading partner.", "David Ricardo's Law of Comparative Advantage: Even if one nation has an absolute advantage in BOTH goods, mutually beneficial trade is still possible if each country specialises in the good where its Opportunity Cost (units of the other good sacrificed) is LOWEST.", "Sources of Comparative Advantage (Heckscher-Ohlin): Differences in relative factor endowments (labour-abundant vs capital/mineral-abundant nations)."], "workedExample": "Model Exam Answer: 'Absolute advantage compares total physical output from given resources, whereas comparative advantage compares opportunity costs (what must be sacrificed to produce 1 unit of a good). Even if Country A is more productive in all goods, both countries gain from trade when each specialises in the good for which it has the lowest opportunity cost.'"}, {"id": "theo_6_3", "code": "6.3", "topic": "Exchange rate determination", "formula": "Demand for $ (SA importers, SA investors/students paying abroad) vs Supply of $ (foreign buyers of SA exports/shares, foreign tourists)", "beginnerTip": "If Supply of $ decreases (shifts left), the rand price of $ rises (e.g., R8 to R9 per $). That means the Rand has DEPRECIATED, making SA exports cheaper abroad and imports more expensive.", "knowledgePoints": ["On the Foreign Exchange Market diagram (Rand/Dollar market), the vertical axis measures the exchange rate (Rand price per $1, e.g., R18/$1) and the horizontal axis measures the quantity of US Dollars ($).", "Who DEMANDS Dollars (downward-sloping D$ curve): SA importers buying US goods, SA residents travelling/studying in the USA, SA investors buying US shares/bonds.", "Who SUPPLIES Dollars (upward-sloping S$ curve): Foreign buyers of SA exports (gold, wine, platinum), foreign tourists visiting SA, foreign investors buying SA bonds/shares (capital inflows).", "Appreciation vs Depreciation: If Demand for $ shifts RIGHT (or Supply of $ shifts LEFT), the Rand price of $1 rises (e.g., R18/$ → R20/$)—the Dollar appreciates and the Rand DEPRECIATES. A Rand depreciation makes SA exports cheaper abroad (boosting X) and imports more expensive in Rands (fuelling imported cost-push inflation)."], "workedExample": "Model Exam Answer: 'If US demand for South African mineral exports falls, the supply of US dollars (S$) shifts leftward. At the original exchange rate there is an excess demand for dollars, driving the Rand/Dollar exchange rate up (e.g., from R18/$ to R20/$). The US dollar appreciates while the South African Rand depreciates.'"}, {"id": "theo_6_4", "code": "6.4", "topic": "Exchange rate and trade policies", "formula": "Trade barriers (tariffs, quotas): Arguments FOR (infant industry, anti-dumping, jobs, BoP, revenue) vs AGAINST (retaliation, higher consumer prices, inefficiency)", "beginnerTip": "Know the difference between an ad valorem tariff (% of value), a specific tariff (fixed rand amount per unit), and an import quota (physical limit on quantity).", "knowledgePoints": ["Forms of Trade Protectionism (Import Restrictions): (1) Ad valorem tariffs (percentage tax on imported value), (2) Specific tariffs (fixed Rand fee per physical unit imported), (3) Import quotas (quantitative limit on units imported), (4) Subsidies to domestic producers, and (5) Non-tariff barriers (strict customs/health regulations, exchange controls).", "Arguments FOR Trade Barriers: (1) Infant industry argument (shielding young industries until they achieve economies of scale), (2) Anti-dumping (preventing foreign predators from selling below cost), (3) Protecting domestic employment in labour-intensive sectors, (4) Raising government customs revenue, (5) Improving the Balance of Payments / national strategic self-sufficiency.", "Arguments AGAINST Trade Barriers: (1) Retaliation (trade wars that hurt domestic exporters), (2) Higher prices and reduced choice for domestic consumers, (3) Protection of complacency and x-inefficiency (infant industries never 'grow up'), (4) Higher input costs for domestic firms using imported components.", "Exchange Rate Policy Regimes: Free-floating (SARB lets market D$ and S$ set the rate), Managed floating (central bank intervenes to smooth extreme volatility), and Fixed exchange rate (pegged to another currency)."], "workedExample": "Model Exam Answer: 'Governments restrict trade using specific or ad valorem tariffs and import quotas to nurture infant industries, prevent foreign dumping, and protect domestic jobs. However, protectionism raises consumer prices, shields inefficient domestic monopolies from competition, and invites foreign retaliation against domestic exports.'"}]}, {"id": "theo_7", "number": "7", "title": "The Keynesian Model", "chapterId": "ch17", "chapterLabel": "Chapters 17 & 18", "extremePageId": "B9", "items": [{"id": "theo_7_1", "code": "7.1", "topic": "Determination of income using the Keynesian model", "formula": "Assumptions (constant prices/wages, demand drives output), Consumption function C = C̄ + cY (3 traits), Investment determinants, Tax & G effects on multiplier", "beginnerTip": "Remember: raising the tax rate t increases leakages and shrinks the multiplier α, whereas raising government spending G does NOT change α—it shifts Ā up and raises Y by α × ΔG.", "knowledgePoints": ["Core Assumptions of the Simple Keynesian Model: Prices and wages are completely fixed/constant, there is spare capacity (unemployment exists), the money market/interest rate is fixed, and Aggregate Demand (A) solely determines the level of output and income (Y) (reversing Say's Law).", "Three Characteristics of the Consumption Function (C = C̄ + cY): (1) Consumption is positive even when income Y = 0 (C̄ > 0, autonomous consumption financed by dissaving), (2) When income increases, consumption increases (c > 0), and (3) Consumption increases by LESS than the increase in income (0 < c < 1, because households save part of every extra Rand).", "45-Degree Line Equilibrium: Every point on the 45° line represents A = Y. Above the 45° line, A > Y (excess spending → unplanned inventory depletion → firms expand production Y). Below the 45° line, A < Y (insufficient spending → unplanned inventory accumulation → firms cut production Y).", "Fiscal & Open-Economy Effects: Government spending (G) and Exports (X) are autonomous injections (shift A parallel upward; do NOT change the multiplier α). Proportional Taxes (t) and Induced Imports (m) are leakages that flatten the slope of the A curve and REDUCE the size of the multiplier α = 1 ÷ [1 − c(1 − t) + m]."], "workedExample": "Model Exam Answer: 'In the Keynesian model, aggregate expenditure determines national income around the 45° line (where A = Y). Whenever A > Y, unplanned inventory falls signal firms to increase output. Introducing a proportional tax rate t or marginal propensity to import m increases leakages out of the circular flow, flattening the AE slope and reducing the multiplier, whereas autonomous government spending G shifts the AE intercept upward without altering the multiplier.'"}]}, {"id": "theo_8", "number": "8", "title": "Unemployment", "chapterId": "ch21", "chapterLabel": "Chapter 21", "extremePageId": "B10", "items": [{"id": "theo_8_1", "code": "8.1", "topic": "Types of unemployment", "formula": "1. Frictional (temporary job search)  |  2. Structural (skills/automation mismatch)  |  3. Seasonal (tourism/harvest)  |  4. Cyclical (recession/low aggregate demand)", "beginnerTip": "Also distinguish Strict (searched in past 4 weeks) vs Broad (includes discouraged work-seekers) definitions, and how people enter or leave the unemployment pool.", "knowledgePoints": ["Four Types of Unemployment:", "1. Frictional Unemployment: Short-term, unavoidable search unemployment when people voluntarily switch jobs or recent graduates enter the labour market looking for their first post.", "2. Structural Unemployment: Long-term mismatch between the skills/location of unemployed workers and the requirements of available jobs, or permanent job losses due to automation, capital-intensive technology, or declining industries (e.g., gold mining).", "3. Cyclical (Demand-Deficiency) Unemployment: Caused by a recession/downswing in the business cycle when Aggregate Demand falls (workers are laid off temporarily until the economy recovers).", "4. Seasonal Unemployment: Occurs in industries where labour demand fluctuates predictably by season (e.g., agriculture harvesting, December tourism/retail).", "Also know the Unemployment Pool Flows: Inflows (new entrants, re-entrants, job losers/retrenched, voluntary quitters) vs Outflows (finding a job, withdrawing from the labour force)."], "workedExample": "Model Exam Answer: 'A university graduate searching for her first job experiences frictional unemployment; a retrenched mineworker whose skills are replaced by automated machinery faces structural unemployment; a construction worker laid off during a national recession suffers cyclical unemployment; and a fruit picker jobless outside harvest months experiences seasonal unemployment.'"}, {"id": "theo_8_2", "code": "8.2", "topic": "Causes of unemployment", "formula": "Structural causes in SA: skills/education mismatch, automation/mechanisation, shifting demand, foreign competition, declining industries", "beginnerTip": "Structural unemployment is South Africa's most serious long-term challenge because jobs lost to automation cannot be fixed simply by boosting short-term demand.", "knowledgePoints": ["Why Unemployment is So High and Persistent in South Africa ( predominantly Structural + Cyclical):", "1. Severe Skills Mismatch: Oversupply of unskilled/semi-skilled labour alongside an acute shortage of artisans, engineers, and technical/managerial professionals (legacy of unequal education).", "2. Capital Deepening & Automation: Firms substituting capital/machinery for labour due to high unit labour costs, strict labour regulations, and industrial unrest.", "3. Slow Economic Growth & Infrastructure Bottlenecks: Electricity (load-shedding) and transport/rail constraints limiting industrial expansion and job-absorbing growth.", "4. Rapid Growth of the Labour Force: High youth population growth and rural-urban migration exceeding the rate of formal job creation."], "workedExample": "Model Exam Answer: 'Unemployment in South Africa is primarily structural, driven by a deep mismatch between an oversupply of unskilled workers and firms' demand for skilled labour, compounded by capital-intensive mechanisation, rigid labour market conditions, infrastructure bottlenecks, and slow economic growth that fails to absorb new youth entrants.'"}, {"id": "theo_8_3", "code": "8.3", "topic": "Effects of unemployment", "formula": "Individual & social costs (loss of income/skills, poverty, inequality, crime) + Supply-side policies (education, vocational training, retraining)", "beginnerTip": "Policies to reduce unemployment can target the supply side (better education/skills training) or the demand side (labour-intensive growth and support for SMEs).", "knowledgePoints": ["Costs and Effects of Unemployment: (1) Individual loss of income, self-esteem, and human capital (skills atrophy during long joblessness), (2) Lost national output (economy operates inside its Production Possibility Curve), (3) Fiscal burden on the state (lost tax revenue + higher spending on social grants/UIF), and (4) Social/political costs (worsening poverty, severe income inequality, crime, and social instability).", "Supply-Side Policies to Reduce Unemployment: Improve the quality of basic, STEM, and vocational/TVET education; retrain workers for growing industries; promote labour market flexibility; support small, medium, and micro-enterprises (SMMEs) and the informal sector.", "Demand-Side Policies to Reduce Unemployment: Stimulate labour-intensive economic growth, expand public works programmes (EPWP), and encourage domestic investment and export-oriented manufacturing.", "Link to Phillips Curve & Incomes Policy: Because supply-side structural unemployment cannot be cured by printing money alone, long-run job creation requires combining human capital investment with stable macroeconomic growth."], "workedExample": "Model Exam Answer: 'Unemployment inflicts severe personal hardship, erodes worker skills, reduces GDP below potential, widens inequality, and strains the government budget. Addressing it requires supply-side policies—such as vocational skills training, education reform, and SMME deregulation—alongside demand-side support for labour-intensive investment and public infrastructure programmes.'"}]}], "instructions": "Instructions: Go through each topic and indicate your current level of preparation by ticking the appropriate box. Use this checklist to identify areas that require further revision.", "preparationKey": [{"id": "not_yet", "label": "Not yet prepared", "desc": "I struggle to explain or discuss this topic."}, {"id": "partial", "label": "Partially prepared", "desc": "I understand some aspects of the topic but need further revision."}, {"id": "well", "label": "Well prepared", "desc": "I can explain and discuss this topic confidently and independently."}]}]};
    const FALLBACK_KEY = 'econ122_scope_progress_v1';
    let activeFilter = 'all';

    function getDeviceId() {
      try {
        const t = JSON.parse(localStorage.getItem('econ122_telemetry_v1') || '{}');
        if (t && t.deviceId) return t.deviceId;
      } catch (_) {}
      return 'DEV-LOCAL';
    }

    function getStorageKey() {
      return 'scope_progress_' + getDeviceId();
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(getStorageKey()) || localStorage.getItem('econ122_scope_progress_' + getDeviceId()) || localStorage.getItem(FALLBACK_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          return {
            deviceId: getDeviceId(),
            checked: p.checked || {},
            levels: p.levels || {},
            priorities: p.priorities || { calc_1: '', calc_2: '', calc_3: '', theo_1: '', theo_2: '', theo_3: '' }
          };
        }
      } catch (_) {}
      return {
        deviceId: getDeviceId(),
        checked: {},
        levels: {},
        priorities: { calc_1: '', calc_2: '', calc_3: '', theo_1: '', theo_2: '', theo_3: '' }
      };
    }

    let state = loadState();

    function saveState() {
      state.updatedAt = new Date().toISOString();
      const s = JSON.stringify(state);
      try {
        localStorage.setItem(getStorageKey(), s);
        localStorage.setItem('econ122_scope_progress_' + getDeviceId(), s);
        localStorage.setItem(FALLBACK_KEY, s);
      } catch (_) {}
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderApp() {
      const root = document.getElementById('local-scope-root');
      const allItems = [];
      EXAM_SCOPE.sections.forEach(sec => sec.groups.forEach(g => g.items.forEach(it => allItems.push({ ...it, secId: sec.id }))));
      const calcItems = allItems.filter(i => i.secId === 'scope_calculations');
      const theoItems = allItems.filter(i => i.secId === 'scope_theory');
      const wellCount = allItems.filter(i => state.checked[i.id] || state.levels[i.id] === 'well').length;
      const calcWell = calcItems.filter(i => state.checked[i.id] || state.levels[i.id] === 'well').length;
      const theoWell = theoItems.filter(i => state.checked[i.id] || state.levels[i.id] === 'well').length;
      const partialCount = allItems.filter(i => state.levels[i.id] === 'partial' && !state.checked[i.id]).length;
      const notYetCount = allItems.filter(i => state.levels[i.id] === 'not_yet' && !state.checked[i.id]).length;
      const pct = Math.round((wellCount / allItems.length) * 100);

      const sectionsHtml = EXAM_SCOPE.sections
        .filter(sec => activeFilter === 'calc' ? sec.id === 'scope_calculations' : (activeFilter === 'theory' ? sec.id === 'scope_theory' : true))
        .map(sec => {
          const isCalc = sec.id === 'scope_calculations';
          const prepKeys = (sec.preparationKey || []).map(pk => `
            <div class="scope-prep-key-item">
              <span class="scope-prep-key-box">☐</span>
              <span><strong>${escapeHtml(pk.label)}:</strong> ${escapeHtml(pk.desc)}</span>
            </div>
          `).join('');

          const groupsHtml = sec.groups.map(grp => {
            const vis = grp.items.filter(it => activeFilter === 'unmastered' ? !(state.checked[it.id] || state.levels[it.id] === 'well') : true);
            if (!vis.length) return '';
            const grpWell = grp.items.filter(it => state.checked[it.id] || state.levels[it.id] === 'well').length;

            const rows = vis.map(item => {
              const isWell = Boolean(state.checked[item.id] || state.levels[item.id] === 'well');
              const lvl = state.levels[item.id] || (isWell ? 'well' : '');
              const isOpen = expandAll || openIds.has(item.id);
              const kList = (item.knowledgePoints || []).map(kp => `<li>${escapeHtml(kp)}</li>`).join('');

              return `
                <div class="scope-checklist-item ${isWell ? 'is-mastered' : (lvl === 'partial' ? 'is-partial' : (lvl === 'not_yet' ? 'is-not-yet' : ''))}">
                  <div class="scope-table-row">
                    <div class="scope-col-no tabular-nums">${escapeHtml(item.code)}</div>
                    <div class="scope-col-topic">
                      <div class="scope-topic-title-line">
                        <label class="scope-checkbox-label" for="chk-well-${item.id}">
                          <span class="scope-item-topic">${escapeHtml(item.topic)}</span>
                        </label>
                        <button type="button" class="scope-dropdown-trigger-btn" data-toggle-drop="${item.id}">
                          <span>📚 Knowledge Needed to Check Box</span>
                          <span>${isOpen ? '▴' : '▾'}</span>
                        </button>
                      </div>
                    </div>
                    <div class="scope-col-check">
                      <label class="scope-box-cell ${lvl === 'not_yet' ? 'checked-not-yet' : ''}">
                        <input type="checkbox" class="scope-level-checkbox" data-item="${item.id}" data-lvl="not_yet" ${lvl === 'not_yet' ? 'checked' : ''} />
                        <span class="scope-mobile-col-label">Not yet prepared</span>
                      </label>
                    </div>
                    <div class="scope-col-check">
                      <label class="scope-box-cell ${lvl === 'partial' ? 'checked-partial' : ''}">
                        <input type="checkbox" class="scope-level-checkbox" data-item="${item.id}" data-lvl="partial" ${lvl === 'partial' ? 'checked' : ''} />
                        <span class="scope-mobile-col-label">Partially prepared</span>
                      </label>
                    </div>
                    <div class="scope-col-check">
                      <label class="scope-box-cell ${isWell ? 'checked-well' : ''}">
                        <input type="checkbox" id="chk-well-${item.id}" class="scope-level-checkbox" data-item="${item.id}" data-lvl="well" ${isWell ? 'checked' : ''} />
                        <span class="scope-mobile-col-label">Well prepared</span>
                      </label>
                    </div>
                  </div>

                  <details class="scope-knowledge-dropdown" data-det="${item.id}" ${isOpen ? 'open' : ''}>
                    <summary class="scope-knowledge-summary">
                      💡 Click to ${isOpen ? 'hide' : 'view'} the knowledge, formulas &amp; worked example needed to check <strong>${escapeHtml(item.code)} ${escapeHtml(item.topic)}</strong>
                    </summary>
                    <div class="scope-item-guide">
                      <div class="scope-formula-bar">
                        <strong>📐 Core Formula / Framework:</strong> <span>${escapeHtml(item.formula)}</span>

                      </div>
                      <div class="scope-knowledge-box">

                      </div>
                      <div class="scope-example-box">
                        <div class="scope-example-heading">📝 Step-by-Step Worked Exam Example:</div>
                        <div class="scope-example-body">${escapeHtml(item.workedExample).replace(/\n/g, '<br/>')}</div>
                      </div>
                      <div class="scope-dropdown-footer">
                        <button type="button" class="btn-secondary" data-mark-well="${item.id}">
