                        </button>
                      </div>
                    </div>
                  </details>
                </div>
              `;
            }).join('');

            return `
              <div class="scope-group-section">
                <div class="scope-group-banner">
                  <div class="scope-group-banner-left">
                    <span class="scope-group-num">${escapeHtml(grp.number)}</span>
                    <strong class="scope-group-title">${escapeHtml(grp.title)}</strong>
                    <span class="badge badge-sky">${escapeHtml(grp.chapterLabel)}</span>
                    <span class="badge ${grpWell === grp.items.length ? 'badge-emerald' : 'badge-amber'}">${grpWell}/${grp.items.length} Well Prepared</span>
                  </div>
                </div>
                <div class="scope-items-stack">${rows}</div>
              </div>
            `;
          }).join('');

          const prioHtml = isCalc ? `
            <div class="scope-priorities-block">
              <h4>My revision priorities</h4>
              <div class="scope-priorities-grid">
                <div class="scope-priority-row">
                  <label>1. The topic I need to spend the most time on:</label>
                  <input type="text" class="num-input" data-prio="calc_1" value="${escapeHtml(state.priorities.calc_1)}" style="font-family:var(--font-sans);" />
                </div>
                <div class="scope-priority-row">
                  <label>2. The topic I need to practise more:</label>
                  <input type="text" class="num-input" data-prio="calc_2" value="${escapeHtml(state.priorities.calc_2)}" style="font-family:var(--font-sans);" />
                </div>
                <div class="scope-priority-row">
                  <label>3. The topic I feel most confident about:</label>
                  <input type="text" class="num-input" data-prio="calc_3" value="${escapeHtml(state.priorities.calc_3)}" style="font-family:var(--font-sans);" />
                </div>
              </div>
            </div>
          ` : `
            <div class="scope-priorities-block">
              <h4>My revision priorities</h4>
              <div class="scope-priorities-grid">
                <div class="scope-priority-row">
                  <label>1. The topic I need to spend the most time on:</label>
                  <input type="text" class="num-input" data-prio="theo_1" value="${escapeHtml(state.priorities.theo_1)}" style="font-family:var(--font-sans);" />
                </div>
                <div class="scope-priority-row">
                  <label>2. The topic I need to practise explaining or discussing:</label>
                  <input type="text" class="num-input" data-prio="theo_2" value="${escapeHtml(state.priorities.theo_2)}" style="font-family:var(--font-sans);" />
                </div>
                <div class="scope-priority-row">
                  <label>3. The topic I feel most confident about:</label>
                  <input type="text" class="num-input" data-prio="theo_3" value="${escapeHtml(state.priorities.theo_3)}" style="font-family:var(--font-sans);" />
                </div>
              </div>
            </div>
          `;

          return `
            <div class="glass-card scope-section-block" style="margin-bottom: 2rem;">
              <div class="scope-official-sec-header">
                <h2>${escapeHtml(sec.title)}</h2>
                <p class="scope-sec-instructions">${escapeHtml(sec.instructions)}</p>
                <div class="scope-prep-key-box-wrap">
                  <div style="font-weight:700; font-size:0.84rem; margin-bottom:0.35rem; color:var(--text-primary);">Preparation key:</div>
                  ${prepKeys}
                </div>
              </div>
              <div class="scope-table-frame">
                <div class="scope-table-header">
                  <div class="scope-col-no">No.</div>
                  <div class="scope-col-topic">Topic</div>
                  <div class="scope-col-check">Not yet<br/>prepared</div>
                  <div class="scope-col-check">Partially<br/>prepared</div>
                  <div class="scope-col-check">Well<br/>prepared</div>
                </div>
                ${groupsHtml}
              </div>
              ${prioHtml}
            </div>
          `;
        }).join('');

      root.innerHTML = `
        <div class="glass-card scope-hero-card" style="margin-bottom: 1.5rem;">
          <div class="scope-hero-top">
            <div>
              <div class="meta-pill-row">
                <span class="badge badge-emerald">✓ Saved Locally (${escapeHtml(state.deviceId)})</span>
                <span class="badge badge-sky">46 Official Exam Scope Topics</span>
              </div>
              <h2>${escapeHtml(EXAM_SCOPE.title)}</h2>
              <p style="margin-top:0.35rem; font-size:0.88rem; max-width:85ch; color:var(--text-secondary);">${escapeHtml(EXAM_SCOPE.disclaimer)}</p>
            </div>
            <div class="scope-progress-summary-box">
              <div class="scope-big-pct tabular-nums">${pct}%</div>
              <div class="scope-big-sub">${wellCount} of ${allItems.length} Well Prepared</div>
            </div>
          </div>
          <div class="scope-progress-track">
            <div class="scope-progress-fill" style="width:${pct}%;"></div>
          </div>
          <div class="scope-kpi-strip">
            <div class="scope-mini-stat"><span>Calculations (Well Prepared):</span> <strong class="tabular-nums">${calcWell} / ${calcItems.length}</strong></div>
            <div class="scope-mini-stat"><span>Theory (Well Prepared):</span> <strong class="tabular-nums">${theoWell} / ${theoItems.length}</strong></div>
            <div class="scope-mini-stat"><span>Partially Prepared:</span> <strong class="tabular-nums">${partialCount}</strong></div>
            <div class="scope-mini-stat"><span>Not Yet Prepared:</span> <strong class="tabular-nums">${notYetCount}</strong></div>
          </div>
          <div class="scope-toolbar">
            <div class="scope-filter-group">
              <button type="button" class="btn-secondary ${activeFilter === 'all' ? 'active-filter' : ''}" data-flt="all">All Topics (46)</button>
              <button type="button" class="btn-secondary ${activeFilter === 'calc' ? 'active-filter' : ''}" data-flt="calc">1. Calculations (25)</button>
              <button type="button" class="btn-secondary ${activeFilter === 'theory' ? 'active-filter' : ''}" data-flt="theory">2. Theory (21)</button>
              <button type="button" class="btn-secondary ${activeFilter === 'unmastered' ? 'active-filter' : ''}" data-flt="unmastered">Needs Revision (${allItems.length - wellCount})</button>
            </div>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
              <button type="button" class="btn-secondary" id="btn-expand-all">${expandAll ? '📁 Collapse All Dropdowns' : '📂 Expand All Knowledge Dropdowns'}</button>
              <button type="button" class="btn-ghost" id="btn-reset-all">↺ Reset Checklist</button>
            </div>
          </div>
        </div>
        ${sectionsHtml}
      `;

      root.querySelectorAll('details.scope-knowledge-dropdown').forEach(det => {
        det.addEventListener('toggle', () => {
          const id = det.getAttribute('data-det');
          if (det.open) openIds.add(id);
          else openIds.delete(id);
        });
      });

      root.querySelectorAll('[data-toggle-drop]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-toggle-drop');
          const det = root.querySelector(`details[data-det="${id}"]`);
          if (det) {
            det.open = !det.open;
            if (det.open) openIds.add(id);
            else openIds.delete(id);
            renderApp();
          }
        });
      });

      root.querySelectorAll('.scope-level-checkbox').forEach(chk => {
        chk.addEventListener('change', () => {
          const id = chk.getAttribute('data-item');
          const lvl = chk.getAttribute('data-lvl');
          const next = chk.checked ? lvl : '';
          state.levels[id] = next;
          state.checked[id] = (next === 'well');
          saveState();
          renderApp();
        });
      });

      root.querySelectorAll('[data-mark-well]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-mark-well');
          state.levels[id] = 'well';
          state.checked[id] = true;
          saveState();
          renderApp();
        });
      });

      root.querySelectorAll('[data-flt]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.getAttribute('data-flt');
          renderApp();
        });
      });

      root.querySelector('#btn-expand-all').addEventListener('click', () => {
        expandAll = !expandAll;
        if (!expandAll) openIds.clear();
        renderApp();
      });

      root.querySelector('#btn-reset-all').addEventListener('click', () => {
        state.checked = {};
        state.levels = {};
        state.priorities = { calc_1: '', calc_2: '', calc_3: '', theo_1: '', theo_2: '', theo_3: '' };
        saveState();
        renderApp();
      });

      root.querySelectorAll('[data-prio]').forEach(inp => {
        inp.addEventListener('input', () => {
          state.priorities[inp.getAttribute('data-prio')] = inp.value;
          saveState();
        });
      });
    }

    document.getElementById('btn-theme-toggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    });

    renderApp();
  </script>
</body>
</html>
